name: rob
channels:
  - pytorch
  - nvidia
  - conda-forge # <--- Make sure conda-forge is listed
  - defaults
dependencies:
  # --- Core ---
  - python=3.9
  # --- PyTorch (Specify the working combo) ---
  - pytorch=2.4.* # <--- Changed version
  - pytorch-cuda=11.8 # <--- Changed version
  - torchtext
  # --- System Libs (Add libgomp) ---
  - conda-forge::libgomp # <--- Explicitly add libgomp
  # --- Other Libraries ---
  - conda-forge::pandas>=1.3.0,<3.0.0
  - conda-forge::spacy>=3.0.0,<4.0.0
  - conda-forge::dill>=0.3.0
  - pip
  # --- Pip packages ---
  - pip:
    - transformers>=4.30.0,<5.0.0
    - sentence-transformers>=2.2.0
    - debugpy # Optional