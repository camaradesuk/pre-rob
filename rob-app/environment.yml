name: rob
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pandas>=1.3,<3
  - dill>=0.3
  - pip
  - pip:
      # build‑toolchain pins for spaCy 2.3
      - setuptools<60
      - wheel<0.40
      - cython<0.30,>=0.29

      # runtime deps
      - spacy==2.3.2
      - en-core-web-sm==2.3.1
      - torchtext==0.17.2    # wheel built for PT 2.6.*
      - transformers>=4.30,<5
      - sentence-transformers>=2.2.0
      - debugpy
